[project]
name = "local-scope-backend"
version = "0.1.0"
description = "Local-Scope CS2 Demo Parser & Analytics Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "demoparser2>=0.42.1",
    "polars>=0.20.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "zstandard>=0.22.0",
    "orjson>=3.9.0",
    "requests>=2.31.0",
    "pillow>=10.2.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
