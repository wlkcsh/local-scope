name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Tests & Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create virtualenv and install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Run Pytest suite
        env:
          DATABASE_URL: sqlite:////tmp/ci_test.db
          DATA_DIR: /tmp/ci_data
          TMP_DIR: /tmp/ci_scratch
          JWT_SECRET_KEY: test_ci_secret_key_1234567890_min_32_chars
        run: |
          uv run pytest tests/ -v

  frontend:
    name: Frontend Typecheck, Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript typecheck
        run: pnpm run typecheck

      - name: Run Vitest suite
        run: pnpm test

      - name: Next.js production build
        run: pnpm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  docker-compose:
    name: Docker Compose Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose build
        run: |
          docker compose build
