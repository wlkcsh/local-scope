name: "🐛 Bug Report"
description: "File an issue describing unexpected behavior, errors, or visual glitches."
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this issue! Please provide as much detail as possible to help us reproduce and resolve it quickly.

  - type: dropdown
    id: component
    attributes:
      label: Component Affected
      description: Which part of Local-Scope is experiencing the problem?
      options:
        - "Backend (FastAPI / Database / Ingestion API)"
        - "CS2 Demo Parser (demoparser2 / Telemetry Pipeline)"
        - "Frontend (Next.js / Dashboard / Match View)"
        - "2D Radar Replay (HTML5 Canvas / Controls / Playback Clock)"
        - "Authentication & Multi-User Sharing"
        - "Docker Compose / Deployment"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: "e.g., Radar replay freeze at round 12 on de_mirage..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we trigger or reproduce the behavior?
      placeholder: |
        1. Ingest demo file via `/api/ingest/upload`
        2. Navigate to match `/matches/<id>/replay`
        3. Jump to round 8
        4. Observe player marker coordinates offset
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment & Stack Details
      description: OS version, browser, Docker/local setup, Node/Python version.
      placeholder: "macOS 15.3, Chrome 133, Docker Compose or local uv 0.5.x"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Screenshots
      description: Paste any terminal stack traces, browser console errors, or screenshots.
      render: shell
    validations:
      required: false
